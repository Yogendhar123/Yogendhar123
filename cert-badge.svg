<svg width="420" height="120" viewBox="0 0 420 120" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="cbg" x1="0" y1="0" x2="420" y2="120" gradientUnits="userSpaceOnUse">
    <stop stop-color="#050507"/>
    <stop offset="1" stop-color="#071426"/>
  </linearGradient>
  <filter id="cblur"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
<rect width="420" height="120" rx="16" fill="url(#cbg)"/>
<rect x="1" y="1" width="418" height="118" rx="15" stroke="#2F8CFF" stroke-opacity=".35"/>

<!-- pulsing glow behind badge -->
<circle cx="60" cy="60" r="34" fill="#2F8CFF" opacity=".25" filter="url(#cblur)">
  <animate attributeName="r" values="30;40;30" dur="2.4s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values=".15;.4;.15" dur="2.4s" repeatCount="indefinite"/>
</circle>

<!-- rotating ring -->
<g transform="translate(60 60)">
  <circle r="30" stroke="#5EC8FF" stroke-opacity=".5" stroke-width="2" stroke-dasharray="6 6">
    <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle r="22" fill="#0B1B2E" stroke="#2F8CFF" stroke-width="1.5"/>
  <!-- check mark -->
  <path d="M-9 0 L-2 8 L11 -9" stroke="#8FE3FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <animate attributeName="stroke-dasharray" values="0,40;40,0" dur="1.6s" fill="freeze"/>
  </path>
</g>

<text x="110" y="42" fill="#5EC8FF" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="3">CERTIFIED · ANTHROPIC</text>
<text x="110" y="68" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="800">Claude Certified Associate</text>
<text x="110" y="90" fill="#9AA0AB" font-family="Arial, Helvetica, sans-serif" font-size="13">Foundations · Score 884/1000 · Pass</text>

<circle cx="398" cy="16" r="4" fill="#5EC8FF">
  <animate attributeName="opacity" values="1;.2;1" dur="1.8s" repeatCount="indefinite"/>
</circle>
</svg>
